name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        # Using curl to hit the health endpoint
        # The URL will be populated via a GitHub repository secret
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret is not set. Skipping ping."
            exit 0
          fi
          
          echo "Pinging ${{ secrets.BACKEND_URL }}/health..."
          status_code=$(curl -o /dev/null -s -w "%{http_code}\n" "${{ secrets.BACKEND_URL }}/health")
          
          if [ "$status_code" -eq 200 ]; then
            echo "Successfully pinged backend (Status: 200 OK)"
          else
            echo "Failed to ping backend (Status: $status_code)"
            exit 1
          fi

services:
  # Backend API + Worker Service (Combined to fit Free Tier)
  - type: web
    name: satori-api
    env: python
    plan: free
    region: ohio
    buildCommand: "cd backend && pip install -r requirements.txt"
    # Run the RQ worker in the background and uvicorn in the foreground
    startCommand: "cd backend && (python -m rq worker -u $REDIS_URL satori_tasks & python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT)"
    envVars:
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHONPATH
        value: ".."
